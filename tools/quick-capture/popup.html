<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <span class="brand"><img src="icons/icon32.png" alt="" /> Second Brain</span>
    <button id="gear" class="icon" title="Settings" aria-label="Settings">⚙</button>
  </header>

  <main id="capture">
    <label class="row">
      <span>Link</span>
      <div class="link">
        <input id="url" type="url" placeholder="https://…" />
        <button id="clearUrl" class="icon small" title="Don't save this link">✕</button>
      </div>
      <small id="pageTitle"></small>
    </label>

    <label class="row">
      <span>Note</span>
      <textarea id="text" rows="5" placeholder="Thoughts, a quote, why you're saving this… (paste images here too)"></textarea>
    </label>

    <div id="drop" class="drop" tabindex="0">
      <input id="files" type="file" accept="image/*,video/*" multiple hidden />
      <div>Drop, paste or <a href="#" id="pick">choose</a> images / videos</div>
      <small>Up to 25 MB each. For bigger videos, save the link.</small>
    </div>
    <ul id="previews"></ul>

    <button id="save" class="primary">Save <kbd>⌘↵</kbd></button>
    <div id="status" role="status"></div>
  </main>

  <main id="settings" hidden>
    <p class="hint">Captures are committed to <code>inbox/</code> in your repo. Claude files them on its next run.</p>
    <label class="row"><span>GitHub token</span>
      <input id="token" type="password" placeholder="github_pat_…" autocomplete="off" />
      <small><a href="https://github.com/settings/personal-access-tokens/new" target="_blank">Create a fine-grained token</a>: only this repo, Contents: Read and write.</small>
    </label>
    <div class="cols">
      <label class="row"><span>Owner</span><input id="owner" /></label>
      <label class="row"><span>Repo</span><input id="repo" /></label>
      <label class="row"><span>Branch</span><input id="branch" /></label>
    </div>
    <div class="actions">
      <button id="test">Test connection</button>
      <button id="saveSettings" class="primary">Save settings</button>
    </div>
    <div id="settingsStatus" role="status"></div>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
