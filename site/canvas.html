<!doctype html>
<html lang="en" class="view cv-page">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Brain Canvas</title>
  <meta name="description" content="Moodboards made from Yuvraj's saved notes, stored as JSON Canvas files." />
  <meta name="theme-color" content="#050505" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23050505'/%3E%3Cpath d='M6 26 Q16 -2 26 26' stroke='white' stroke-width='1.6' fill='none'/%3E%3Crect x='13' y='9' width='6' height='6' fill='%2339ff6a'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="views.css" />
  <link rel="stylesheet" href="canvas.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Brain" />
  <meta name="theme-color" content="#050505" />
</head>
<body>
  <header class="vhead">
    <div>
      <a class="brand" href="./" style="text-decoration:none;color:inherit"><span class="brand-mark"></span><span class="brand-name">SECOND BRAIN</span><span class="brand-sub mono">/ canvas</span></a>
      <div class="vtitle" id="title">MOODBOARDS</div>
    </div>
    <div class="vtools">
      <select class="vsearch cv-sel" id="boards" aria-label="Board"></select>
      <div class="vtabs">
        <button type="button" id="b-new" title="New board">NEW</button>
        <button type="button" id="b-auto" title="Build a board from a tag, kind, links, a technique or clusters">AUTO</button>
      </div>
      <div class="vtabs">
        <button type="button" id="b-note" title="Add a note (N)">+ NOTE</button>
        <button type="button" id="b-text" title="Add a text card (T)">+ TEXT</button>
        <button type="button" id="b-group" title="Add a group (G)">+ GROUP</button>
      </div>
      <div class="vtabs">
        <button type="button" id="b-fit" title="Fit (F)">FIT</button>
        <button type="button" id="b-dl" title="Download .canvas">.CANVAS</button>
        <button type="button" id="b-save" title="Save to the repo (Ctrl+S)">SAVE</button>
      </div>
    </div>
  </header>
  <div class="vhint" id="hint">Drag empty space to pan, scroll to zoom. Drag the dot on a card's edge to another card to connect them. Double-click a text card to edit, or empty space to add one. Delete removes the selection.</div>
  <main class="cv" id="cv">
    <div class="cv-world" id="world"><svg class="cv-edges" id="edges"></svg></div>
  </main>
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="views.js"></script>
  <script src="canvas-auto.js"></script>
  <script src="canvas.js"></script>
</body>
</html>
