<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Me · Second Brain</title>
  <meta name="description" content="Yuvraj's personality read, stats and insights, built from his second brain." />
  <meta name="theme-color" content="#050505" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23050505'/%3E%3Cpath d='M6 26 Q16 -2 26 26' stroke='white' stroke-width='1.6' fill='none'/%3E%3Crect x='13' y='9' width='6' height='6' fill='%2339ff6a'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050505; --fg: #f2f2f2; --dim: rgba(242,242,242,.56); --faint: rgba(242,242,242,.14);
      --line: rgba(242,242,242,.1); --accent: #39ff6a;
      --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
      --sans: "Inter Tight", ui-sans-serif, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); }
    body { padding: 0 16px 80px; -webkit-font-smoothing: antialiased; }
    .wrap { max-width: 980px; margin: 0 auto; }
    a { color: var(--fg); text-underline-offset: 3px; text-decoration-color: var(--faint); }
    a:hover { text-decoration-color: var(--accent); }
    .mono { font-family: var(--mono); }
    header { display: flex; align-items: center; justify-content: space-between; padding: 22px 0; border-bottom: 1px solid var(--line); }
    .brand { display: flex; gap: 10px; align-items: center; font: 500 13px/1 var(--mono); letter-spacing: .18em; }
    .brand i { width: 10px; height: 10px; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
    .brand span { color: var(--dim); letter-spacing: .04em; font-weight: 400; }
    nav a { font: 400 12px/1 var(--mono); letter-spacing: .12em; color: var(--dim); text-decoration: none; border: 1px solid var(--line); padding: 8px 10px; }
    nav a:hover { color: var(--fg); border-color: var(--faint); }
    h1 { font-weight: 500; font-size: clamp(36px, 7vw, 64px); letter-spacing: -.02em; margin: 48px 0 8px; }
    .lede { color: var(--dim); max-width: 640px; line-height: 1.55; margin: 0 0 36px; }
    .k { font: 400 11px/1 var(--mono); letter-spacing: .16em; color: var(--dim); text-transform: uppercase; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); margin-bottom: 40px; }
    .tile { background: var(--bg); padding: 18px 16px; }
    .tile b { display: block; font: 500 34px/1.1 var(--sans); margin-top: 10px; font-variant-numeric: tabular-nums; }
    .tile small { color: var(--dim); font-size: 12px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px 48px; margin-bottom: 48px; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
    section h2 { font: 400 11px/1 var(--mono); letter-spacing: .16em; color: var(--dim); text-transform: uppercase; margin: 0 0 16px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
    .bars { display: grid; gap: 8px; }
    .row { display: grid; grid-template-columns: 110px 1fr 28px; align-items: center; gap: 10px; font-size: 13px; padding: 2px 0; }
    .row:hover .fill { filter: brightness(1.25); }
    .row .lab { display: flex; align-items: center; gap: 8px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .row .lab i { width: 8px; height: 8px; flex: none; }
    .row .val { font: 400 12px/1 var(--mono); color: var(--dim); text-align: right; font-variant-numeric: tabular-nums; }
    .track { height: 10px; }
    .fill { height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; min-width: 2px; }
    .cols { display: flex; align-items: flex-end; gap: 2px; height: 140px; border-bottom: 1px solid var(--faint); }
    .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; position: relative; }
    .col .fill { border-radius: 4px 4px 0 0; width: 100%; }
    .col:hover .fill { filter: brightness(1.25); }
    .col .tipv { position: absolute; bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%); font: 400 11px var(--mono); color: var(--fg); background: #111; border: 1px solid var(--faint); padding: 4px 6px; white-space: nowrap; opacity: 0; pointer-events: none; }
    .col:hover .tipv { opacity: 1; }
    .xlab { display: flex; justify-content: space-between; font: 400 11px var(--mono); color: var(--dim); margin-top: 8px; }
    .ideas { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
    .ideas li { border: 1px solid var(--line); padding: 12px 14px; }
    .ideas .st { font: 400 11px var(--mono); letter-spacing: .1em; color: var(--accent); text-transform: uppercase; margin-right: 8px; }
    .ideas p { margin: 6px 0 0; color: var(--dim); font-size: 13px; line-height: 1.5; }
    article { max-width: 720px; line-height: 1.65; font-size: 16px; }
    article h1 { display: none; }
    article h2 { font: 400 11px/1 var(--mono); letter-spacing: .16em; color: var(--dim); text-transform: uppercase; margin: 48px 0 16px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
    article li { margin: 0 0 10px; }
    article strong { font-weight: 600; }
    article em, article > p { color: var(--dim); }
    .empty { color: var(--dim); font-size: 13px; }
    footer { margin-top: 56px; color: var(--dim); font: 400 11px var(--mono); letter-spacing: .08em; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand"><i></i>SECOND BRAIN <span>/ me</span></div>
      <nav><a href="./">GRAPH ↗</a></nav>
    </header>

    <h1>Me</h1>
    <p class="lede">A read on who you are from what you save, the numbers behind it, and what to work on next. Rebuilt every time something new is filed.</p>

    <div class="tiles" id="tiles"></div>

    <div class="grid">
      <section style="grid-column: 1 / -1">
        <h2>Saves per day</h2>
        <div class="cols" id="per-day" role="img" aria-label="Notes saved per day"></div>
        <div class="xlab" id="per-day-x"></div>
      </section>
      <section><h2>By topic</h2><div class="bars" id="by-topic"></div></section>
      <section><h2>By kind</h2><div class="bars" id="by-kind"></div></section>
      <section><h2>Where it comes from</h2><div class="bars" id="by-source"></div></section>
      <section><h2>Open ideas and to-dos</h2><ul class="ideas" id="ideas"></ul></section>
    </div>

    <article id="read"><p class="empty">Loading…</p></article>

    <footer id="foot"></footer>
  </div>

  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script>
  (async () => {
    const PALETTE = {
      gamedev: "#39ff6a", design: "#ff4fd8", ai: "#4d6bff", tech: "#ff6a1a", business: "#ffe14d",
      productivity: "#22e4ff", health: "#ff3b5c", finance: "#c4ff3b", learning: "#a77bff", life: "#ffa94d", misc: "#a0a4ab", inbox: "#ffffff",
    };
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const count = (arr, f) => arr.reduce((m, x) => { const k = f(x); if (k != null) m.set(k, (m.get(k) || 0) + 1); return m; }, new Map());
    const sorted = (m) => [...m].sort((a, b) => b[1] - a[1]);

    let brain;
    try { brain = await (await fetch("data/brain.json", { cache: "no-cache" })).json(); }
    catch { document.getElementById("read").innerHTML = '<p class="empty">Could not load data.</p>'; return; }
    const notes = brain.notes;

    // tiles
    const days = count(notes, (n) => n.added);
    const dayList = [...days.keys()].sort();
    const toDate = (s) => new Date(s + "T00:00:00Z");
    let longest = 0, run = 0, prev = null;
    for (const d of dayList) { run = prev && toDate(d) - toDate(prev) === 864e5 ? run + 1 : 1; longest = Math.max(longest, run); prev = d; }
    let cur = dayList.length ? 1 : 0;
    for (let i = dayList.length - 1; i > 0 && toDate(dayList[i]) - toDate(dayList[i - 1]) === 864e5; i--) cur++;
    const ideas = notes.filter((n) => n.kind === "idea" || n.kind === "todo");
    const open = ideas.filter((n) => ["new", "exploring", "doing"].includes(n.stage || "new"));
    const done = notes.filter((n) => n.status === "read" || n.status === "done").length;
    const toTry = notes.filter((n) => n.tags.includes("to-try")).length;
    const tiles = [
      ["Notes", notes.length, `${dayList.length} active days`],
      ["Streak", cur, `longest ${longest} days`],
      ["Per day", (notes.length / Math.max(dayList.length, 1)).toFixed(1), "average when active"],
      ["Open ideas", open.length, `${ideas.length} ideas and to-dos`],
      ["To-try", toTry, "saved to try"],
      ["Read or done", done, `of ${notes.length} notes`],
    ];
    document.getElementById("tiles").innerHTML = tiles.map(([k, v, s]) => `<div class="tile"><span class="k">${k}</span><b>${v}</b><small>${s}</small></div>`).join("");

    // saves per day: every day in range, zeros included
    if (dayList.length) {
      const all = [];
      for (let t = toDate(dayList[0]); t <= toDate(dayList[dayList.length - 1]); t = new Date(+t + 864e5)) all.push(t.toISOString().slice(0, 10));
      const max = Math.max(...days.values());
      document.getElementById("per-day").innerHTML = all.map((d) => {
        const v = days.get(d) || 0;
        return `<div class="col"><div class="fill" style="height:${(v / max) * 100}%"></div><span class="tipv">${d} · ${v}</span></div>`;
      }).join("");
      document.getElementById("per-day-x").innerHTML = `<span>${all[0]}</span><span>${all[all.length - 1]}</span>`;
    }

    const bars = (el, rows, colorOf) => {
      const max = Math.max(1, ...rows.map((r) => r[1]));
      document.getElementById(el).innerHTML = rows.map(([k, v]) =>
        `<div class="row" title="${esc(k)}: ${v}"><span class="lab">${colorOf ? `<i style="background:${colorOf(k)}"></i>` : ""}${esc(k)}</span>` +
        `<div class="track"><div class="fill" style="width:${(v / max) * 100}%"></div></div><span class="val">${v}</span></div>`).join("");
    };
    bars("by-topic", sorted(count(notes, (n) => n.topic)), (t) => PALETTE[t] || "#a0a4ab");
    bars("by-kind", sorted(count(notes, (n) => n.kind || "unsorted")));
    const plat = (n) => !n.source ? "own words" : /\/\/(www\.)?(x|twitter)\.com/.test(n.source) ? "x" : /instagram\.com/.test(n.source) ? "instagram" : /github\.com/.test(n.source) ? "github" : "web";
    bars("by-source", sorted(count(notes, plat)));

    document.getElementById("ideas").innerHTML = open.length
      ? open.map((n) => `<li><span class="st">${esc(n.stage || "new")}</span><a href="./#/n/${encodeURIComponent(n.slug)}">${esc(n.title)}</a><p>${esc(n.why || n.summary)}</p></li>`).join("")
      : '<li class="empty">No open ideas. Dump one in chat.</li>';

    // curated read from ME.md (drop the generated stats block; the charts above replace it)
    try {
      let md = await (await fetch("ME.md", { cache: "no-cache" })).text();
      md = md.split("<!-- GENERATED:START")[0];
      if (md.includes("_Last curated")) md = md.slice(md.indexOf("_Last curated"));
      document.getElementById("read").innerHTML = DOMPurify.sanitize(marked.parse(md));
    } catch { document.getElementById("read").innerHTML = ""; }

    document.getElementById("foot").textContent = `BUILT ${brain.generated?.slice(0, 16).replace("T", " ")} UTC${brain.commit ? " · " + brain.commit : ""}`;
  })();
  </script>
</body>
</html>
