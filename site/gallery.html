<!doctype html>
<html lang="en" class="view">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Brain Gallery</title>
  <meta name="description" content="Saved views of Yuvraj's second brain as an image gallery or a table." />
  <meta name="theme-color" content="#050505" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23050505'/%3E%3Cpath d='M6 26 Q16 -2 26 26' stroke='white' stroke-width='1.6' fill='none'/%3E%3Crect x='13' y='9' width='6' height='6' fill='%2339ff6a'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Inter+Tight:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="views.css" />
  <link rel="stylesheet" href="gallery.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Brain" />
  <meta name="theme-color" content="#050505" />
</head>
<body>
  <header class="vhead">
    <div>
      <a class="brand" href="./" style="text-decoration:none;color:inherit"><span class="brand-mark"></span><span class="brand-name">SECOND BRAIN</span><span class="brand-sub mono">/ gallery</span></a>
      <div class="vtitle" id="title">LOADING</div>
    </div>
    <div class="vtools">
      <div class="vtabs" id="layout"><button type="button" data-l="gallery">GALLERY</button><button type="button" data-l="table">TABLE</button></div>
      <input class="vsearch" id="q" type="search" placeholder="filter" autocomplete="off" spellcheck="false" />
      <div class="vtabs"><button type="button" id="b-save" title="Save these filters as a view">SAVE VIEW</button></div>
    </div>
  </header>
  <div class="ga">
    <aside class="ga-side mono" id="side"></aside>
    <section class="ga-main">
      <div class="ga-chips" id="chips"></div>
      <div id="out"></div>
    </section>
  </div>
  <script src="views.js"></script>
  <script src="gallery.js"></script>
</body>
</html>
